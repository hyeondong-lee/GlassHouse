<!DOCTYPE html>
<html lang="ko">
<head>
  	<meta charset="UTF-8">
  	<title>모든, 사라지는 것들</title>
	<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
background-color:black;
}

.container {
  position: relative;
  height: 100vh; /* 브라우저 높이에 맞춤 */
  display: flex;
  justify-content: center;
  align-items: center;
}

.full-height-image {
  height: 100vh;  /* 브라우저 높이와 동일 */
  width: auto;    /* 비율 유지 */
  object-fit: cover; /* 이미지 꽉 채우되 비율 유지 */
}

.audio-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.3); /* 투명 배경 */
  border-radius: 8px;
}
</style>
</head>
<body>

	<div class="container">
  		<img src="Docent.jpg" alt="Image" class="full-height-image">
  		<audio controls class="audio-center">
    		<source src="Docent.mp3" type="audio/mpeg">
    		Your browser does not support the audio element.
  		</audio>
	</div>

</body>
</html>
