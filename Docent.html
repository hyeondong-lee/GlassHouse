<!DOCTYPE html>
<html lang="ko">
<head>
  	<meta charset="UTF-8">
  	<title>모든, 사라지는 것들</title>
	<style>
  	body {
    		margin: 0;
    		background: black;
    		display: flex;
    		flex-direction: column;
    		height: 100vh; /* 전체 화면 높이 */
  	}

  	.image-container {
    		flex: 1; /* 남은 공간을 모두 차지 */
    		display: flex;
    		justify-content: center;
    		align-items: center;
    		overflow: hidden;
  	}

  	.image-container img {
    		height: 100%;
    		width: auto;
    		object-fit: contain;
  	}

  	.audio-player {
    		height: 60px; /* 플레이어 높이 고정 */
    		display: flex;
    		justify-content: center;
    		align-items: center;
    		background: rgba(0, 0, 0, 0); /* 반투명 배경 */
  	}

 	.audio-player audio {
    		width: 300px; /* 오디오 플레이어 가로 크기 */
		background: transparent;
  	}

	</style>
</head>
<body>

	<div class="image-container">
  		<img src="Docent.jpg" alt="배경 이미지">
	</div>

	<div class="audio-player">
  		<audio controls autoplay loop>
    		<source src="Docent.mp3" type="audio/mpeg">
    		브라우저가 오디오 태그를 지원하지 않습니다.
  		</audio>
	</div>

</body>
</html>
