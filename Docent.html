<!DOCTYPE html>
<html lang="ko">
<head>
  	<meta charset="UTF-8">
  	<title>모든, 사라지는 것들</title>
	<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .image-container {
    flex: 1 1 auto; /* 남은 공간 자동 할당 */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .image-container img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain; /* 비율 유지 */
  }

  .audio-player {
    flex: 0 0 auto; /* 고정 영역 */
    height: 60px;   /* 플레이어 높이 */
    background: transparent; /* 투명 배경 */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .audio-player audio {
    width: 300px; /* 플레이어 폭 */
  }
</style>
</head>
<body>

	<div class="image-container">
  		<img src="Docent.jpg" alt="배경 이미지">
	</div>

	<div class="audio-player">
  		<audio controls autoplay loop>
    		<source src="Docent.mp3" type="audio/mpeg">
    		브라우저가 오디오 태그를 지원하지 않습니다.
  		</audio>
	</div>

</body>
</html>
